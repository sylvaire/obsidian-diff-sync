name: Attest release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example 0.1.3
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  attest:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build the plugin
        run: |
          npm ci
          npm run build

      - name: Verify the published assets match the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e 'if (require("./manifest.json").version !== process.env.RELEASE_TAG) process.exit(1)'
          release_dir="$(mktemp -d)"
          gh release download --repo "$GITHUB_REPOSITORY" --dir "$release_dir" \
            --pattern main.js --pattern styles.css --pattern manifest.json -- "$RELEASE_TAG"
          for asset in main.js styles.css manifest.json; do
            cmp "$asset" "$release_dir/$asset"
          done

      - name: Attest the verified assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
